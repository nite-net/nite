name: Build and publish

# Every push and pull request builds, tests and packs Nite, Nite.Cli, Nite.Templates and
# Nite.Diagnostics. Pushing a tag such as v0.6.0 also publishes the packages to nuget.org, as
# version 0.6.0: the tag is the version, so there is nothing to bump first. Other builds are
# prereleases of the next patch after the newest tag (0.6.1-ci.<run number>).
#
# Publishing uses nuget.org trusted publishing, so no long-lived API key is stored anywhere: the
# job exchanges a GitHub OIDC token for an API key that is valid for an hour. It needs:
#   * a trusted publishing policy on nuget.org (Account settings > Trusted Publishing) for
#     repository owner "nite-net", repository "nite", workflow file "ci.yml" and environment "nuget",
#     created by the account that owns the Nite, Nite.Cli and Nite.Templates packages; and
#   * a NUGET_USER secret holding that account's nuget.org profile name (not its email address).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest tag sets the version of untagged builds. fetch-tags alone does not bring
          # tags into a shallow pull request checkout, so take the (small) full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::Tag v$version is not a version. Use v<major>.<minor>.<patch>, optionally with a prerelease suffix (v0.6.0, v0.6.0-beta.1)."
              exit 1
            fi
          else
            # The next patch after the newest release tag, so CI packages sort after it and before
            # the release they lead up to.
            latest=$(git tag --list 'v*' --sort=-v:refname | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            version="$major.$minor.$((patch + 1))-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore tests/Nite.Tests

      - name: Build
        run: dotnet build tests/Nite.Tests -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # Includes the integration tests, which download esbuild, Sass and a few npm packages.
      - name: Test
        run: dotnet test tests/Nite.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: |
          dotnet pack src/Nite -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Nite.Cli -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Nite.Templates -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/Nite.Diagnostics -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment in the nuget.org policy. Add required reviewers to it on GitHub
    # to approve each release before it is pushed.
    environment: nuget
    permissions:
      id-token: write # lets NuGet/login request a GitHub OIDC token
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      # Trades the OIDC token for a short-lived nuget.org API key.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a re-run after a partial failure safe.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
